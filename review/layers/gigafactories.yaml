# CELL FACTORIES: candidates, not records.
#
# Every plant below is a name and a place recalled without a document. It
# carries no source, no page and no quote, and none may enter bd.site as it
# stands. tools/verify_layer_candidates.py fetches the operator page named in
# verify_at, finds the plant or the operator's name on it and writes a site
# contribution whose locator quotes that page.
#
# STATUS IS THE FIELD MOST LIKELY TO BE WRONG. Cell plants are announced,
# delayed, paused, resited, sold and cancelled faster than any recall keeps
# up: Northvolt went bankrupt, ACC paused two plants, FREYR became T1 Energy
# and left Norway, Natron wound down, Cellforce was scaled back. Every status
# here is a prompt to read the page, never a claim - and capacity is absent
# on purpose, because a GWh figure without its nameplate-or-actual status and
# its source is exactly what this database refuses.
schema_version: '1'
candidate_set: gigafactories
recalled_by: Claude, from training data, in a session with no network access to company or industry sources (every
  manufacturer, distributor and publisher domain is blocked by the environment's egress policy)
recalled_on: '2026-09-04'
caveat: 'Every entry here is a NAME RECALLED FROM TRAINING, not a fact read from a document. No entry carries a source,
  a page or a quote, and none may enter bd.* as it stands. tools/verify_layer_candidates.py fetches the page named
  in verify_at, finds the name on it and writes a contribution whose locator quotes that page; only then, and only
  after review, does a name become a record. Statuses, localities and listings are the fields most likely to be stale:
  plants are announced, paused, renamed and cancelled faster than any recall keeps up.'
