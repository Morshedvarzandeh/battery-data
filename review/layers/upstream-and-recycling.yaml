# MINES, REFINERIES, RECYCLERS AND TEST LABORATORIES, and the companies that
# run them: candidates, not records.
#
# The two ends of the chain around the cell: where the lithium, nickel,
# cobalt, graphite and manganese come from, and where the battery goes when
# it is finished. Test laboratories and research facilities are here too,
# because they are the sites that measured what the datasheets claim.
#
# Every entry is a name recalled without a document: no source, no page, no
# quote, no tonnage and no capacity. A resource estimate or an output figure
# is exactly what this database refuses without its reporting code, its
# cut-off grade and its page, so none is even attempted here - the numbers
# come from the annual report the verifier's locator will point at.
#
# Ownership is the other thing to check: Greenbushes, Wodgina, Mount Marion
# and Cauchari-Olaroz are joint ventures, and the operator named below is a
# guess at which partner a source will credit.
schema_version: '1'
candidate_set: upstream-and-recycling
recalled_by: Claude, from training data, in a session with no network access to company or industry sources (every
  manufacturer, distributor and publisher domain is blocked by the environment's egress policy)
recalled_on: '2026-09-04'
caveat: 'Every entry here is a NAME RECALLED FROM TRAINING, not a fact read from a document. No entry carries a source,
  a page or a quote, and none may enter bd.* as it stands. tools/verify_layer_candidates.py fetches the page named
  in verify_at, finds the name on it and writes a contribution whose locator quotes that page; only then, and only
  after review, does a name become a record. Statuses, localities and listings are the fields most likely to be stale:
  plants are announced, paused, renamed and cancelled faster than any recall keeps up.'
