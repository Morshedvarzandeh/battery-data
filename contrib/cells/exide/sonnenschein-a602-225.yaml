    "redistributable": false,
    "note": "Facts only; source body is not redistributed. 10-page Exide technical data sheet (381,728 bytes; PDF created 2023-04-04; no printed date or revision). Main table on page 1: nominal capacity C10 to 1.80 Vpc at 20 °C; dimensions are maxima; weight is approximate; h2 includes the installed connector. The 'Type acc. to DIN' column prints a footnote digit after each type (superscript 1 = DIN 40 742 cells, 2 = DIN 40 744 blocks); the types are recorded without it. The datasheet does not name the electrolyte: the gel designation comes from Exide's own A600 product page (https://www.exidegroup.com/eu/en/product/sonnenschein-a600, retrieved 2026-10-29: 'Valve regulated Gel technology (VRLA)'). Internal resistance is printed without its method and is not recorded (the library keeps AC and DC resistance apart and has no method-free quantity). The constant-current and constant-power discharge tables (pages 3-10, 1.60-1.90 Vpc, 3 min-10 h) are not transcribed; they are kept for the later lead-acid design work. Shelf life ('up to 2 years at 20 °C without recharge') is not recorded."
