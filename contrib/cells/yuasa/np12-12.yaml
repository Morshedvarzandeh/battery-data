    "redistributable": false,
    "note": "Facts only; source body is not redistributed. One-page datasheet generated on request by yuasa.com for SKU NP12-12/250/NF/Box (linked from https://www.yuasa.com/uk/np12-12); it prints 'Data Sheet generated on 29/10/2026 – E&OE'. That is the date the copy was generated, not a revision date, so no document date is recorded. Each download is regenerated, so the SHA-256 (113,233 bytes) identifies the copy inspected, not a revision. Capacities are '20-hr rate Capacity to 1.75V /Cell at 20°C' and '10-hr rate Capacity to 1.8V /Cell at 20°C'; the per-cell end voltages are multiplied by the cells implied by the nominal voltage (the sheet also prints float voltage per block and per cell, 6:1 for 12 V). Charge voltages are per block at 20 °C with the printed tolerances (±1% float, ±3% cyclic) kept in extra; the per-cell values and the correction factors (-3 mV float, -4 mV cyclic, 'from std 20°C') are not recorded because the sheet does not say per what. The float and cyclic charge current limits are printed equal and recorded once. The 10-minute constant-power ratings are not recorded. Internal resistance is 'measured at 1 kHz'."
  },
