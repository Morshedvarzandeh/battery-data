    "license": "proprietary",
    "redistributable": false,
    "note": "Facts only; source body is not redistributed. Four-page Victron Energy datasheet (1,028,647 bytes; PDF created 2025-12-09; no printed date or revision). Page 4 tables give article number, Ah, V, l x w x h, weight, CCA @0°F and RES CAP @80°F per battery; pages 1-4 give range-wide statements recorded on every battery of the range they name. Capacity: 'Rated capacity: 20 hr. discharge at 25°C'; page 1 says the rated capacity 'refers to 20 hour discharge, in other words: a discharge current of 0,05 C' and Table 1 gives 10,8 V as the end voltage of the 20-hour discharge. Table 1 is printed for the 12 V range, so the 6 V AGM battery's end voltage is recorded as unstated. CCA and RES CAP are printed without units; CCA is read as amperes and RES CAP as minutes, the units these ratings are defined in. Their temperatures are printed in Fahrenheit only and converted (0°F = -17.8 °C, 80°F = 26.7 °C). Neither rating states its standard, duration, current or end voltage. Charge voltages are Table 3 settings 'for a 12 V battery' and are recorded on the 12 V batteries only, at the 25 °C centre point that section 14 names for temperature compensation. Storage-mode voltages, the -4 mV/°C per cell compensation, Table 1's capacity-versus-discharge-time percentages and the cycle-life and temperature graphs are not recorded. Small AGM batteries (8-38 Ah) print no CCA or RES CAP. The article number BAT212200084 is printed with a space ('BAT2122000 84'); it is recorded without it."
  },
