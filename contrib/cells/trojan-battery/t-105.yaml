    "redistributable": false,
    "note": "Facts only; source body is not redistributed. Two-page Trojan Battery Company datasheet (937,294 bytes), linked as 'T-105 6V FLOODED BATTERY DATASHEET' from https://www.trojanbattery.com/products/t-105-6v-flooded-battery. Printed '© 2019'. Capacities (footnote B) and minutes (footnote A) are at a constant rate at 80°F (27°C) to 1.75 V/cell; the sheet adds 'Capacities are based on peak performance.' The battery has 3 cells (printed), so the end voltage is 5.25 V. Hour-rate capacities are stored as 1/hours C. C.C.A. and C.A. are printed as '—' (no cranking rating), as are internal resistance and short-circuit current; none is recorded. Charger settings are the 6 V column at 77°F/25°C. The open-circuit-voltage rows are the 6 VOLT column of the state-of-charge table; specific gravity and per-cell voltages are not recorded. Dimensions are the millimetre figures; footnotes C and F say they vary with handle and terminal type. The product page prints slightly different dimensions (width 7.11 in (181), height 11.07 in (281)); the datasheet's figures are recorded. The performance and capacity-versus-temperature graphs are not digitised."
  },
