    "redistributable": false,
    "note": "Facts only; source body is not redistributed. One-page supplier datasheet supplied to Lemonergy by a commercial partner on 2026-10-28. The document is issued by a distributor, not by the cell producer, and does not name the producer; the manufacturer is therefore recorded as not stated. The model number is the distributor's designation. The issuing distributor's company name and its contact person, e-mail address and telephone number appear on the document and are deliberately not recorded, at the repository owner's instruction. The document is identified by its SHA-256 only and has no public URL. Cathode family is read from the NFPP prefix of the model designation. Charge and discharge ratings are printed as constant-power rates (P) with the corresponding watts; no current is printed. The cycle-life figures are printed with 1P/1P, 100% DOD and a 300 kgf fixture force; end-of-life criterion is not stated. The thickness 71.7 mm is drawn at 300 kgf ± 20 kgf. The drawing gives two heights, H2 207.10 ± 0.5 mm and H1 204.20 ± 0.5 mm; both are kept, H2 first because the table prints it. Held: '1P Discharge Energy Retention ≥96%' (reference and test not stated). Not recorded: the 'Special at 0V: Shippable and Rechargeable' claim (a qualitative statement, no voltage quantity fits it). The cycle-life graph is not digitised."
  },
