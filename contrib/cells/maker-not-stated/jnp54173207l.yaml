    "redistributable": false,
    "note": "Facts only; source body is not redistributed. One-page supplier cell spreadsheet supplied to Lemonergy by a commercial partner on 2026-10-28. The document is issued by a distributor, not by the cell producer, and does not name the producer; the manufacturer is therefore recorded as not stated. The model number is the distributor's designation. The issuing distributor's company name and its contact person, e-mail address and telephone number appear on the document and are deliberately not recorded, at the repository owner's instruction. The document is identified by its SHA-256 only and has no public URL. Quotes are normalized table transcriptions: row model, column header, then the cell text as printed. The sheet states no test conditions. Capacity rate, temperature and cut-off; AC resistance frequency, SOC and temperature; cycle-life temperature, depth of discharge and end-of-life criterion are all unstated. C-rates are kept as printed and never converted to amperes, because the sheet does not state the capacity they refer to. 'cont' and 'pulse' labels are kept; no pulse duration is printed. A Charge Rate printed without 'std' or 'max' is recorded as a maximum charge rate with that ambiguity noted on the value. 'Voltage Range' is recorded as the discharge and charge cut-off voltages. Pulse-cycle counts are kept as a qualifier on the cycle-life value, not as full-cycle life. The sheet itself notes that the production schedule is not fixed and that stock and lead time should be checked; Lemonergy's own stock statement is kept separately in offers/lemonergy.json. The capacity cell prints both 100 Ah and 110 Ah without saying which is nominal or typical; both are kept. A separate partner datasheet, NFPP54173204-285Wh, describes a 100 Ah, 2.85 V, 1.5-3.4 V, 3.3 kg NFPP cell of similar size with a different continuous discharge rating (1C), charge-temperature floor (0 °C) and cycle life (≥8000); the documents do not establish that they are the same part. Shape is printed as Prismatic; hard-case construction is the schema's only prismatic format."
  },
