    "redistributable": false,
    "note": "Facts only; source body is not redistributed. Two-page supplier datasheet (page 2 repeats two chart images and has no text) supplied to Lemonergy by a commercial partner on 2026-10-28. The document is issued by a distributor, not by the cell producer, and does not name the producer; the manufacturer is therefore recorded as not stated. The model number is the distributor's designation. The issuing distributor's company name and its contact person, e-mail address and telephone number appear on the document and are deliberately not recorded, at the repository owner's instruction. The document is identified by its SHA-256 only and has no public URL. The datasheet names no cathode chemistry. The partner spreadsheet's JNP50160118H (NFM, 70 Ah) is not established to be the same part and is a separate record. The SOC-OCV curve is transcribed from the 21 value labels printed on the chart; the 35% label is partly covered by the 30% label and reads 2.878, last digit uncertain. The cycle-life legend '1C/ 2000th/85.36%' is recorded as a measured retention point; its temperature and DOD are not printed. Product-drawing dimensions (120.0, 116.0, 160, 51 mm with tolerances) are not mapped to axes beyond the table's T-W-H figures. Not recorded: the 'Special at 0V: Shippable and Rechargeable' claim (a qualitative statement, no voltage quantity fits it)."
  },
