    "redistributable": false,
    "note": "Facts only; source body is not redistributed. One-page supplier datasheet supplied to Lemonergy by a commercial partner on 2026-10-28. The document is issued by a distributor, not by the cell producer, and does not name the producer; the manufacturer is therefore recorded as not stated. The model number is the distributor's designation. The issuing distributor's company name and its contact person, e-mail address and telephone number appear on the document and are deliberately not recorded, at the repository owner's instruction. The document is identified by its SHA-256 only and has no public URL. Cathode family is read from the NFPP prefix of the model designation. Charge and discharge ratings are printed as constant-power rates (P) with the corresponding watts; no current is printed. Cycle life is printed at 0.5P, room temperature (no number given), 100% DOD and a 300 kgf fixture force, to 80% and to 70% of an unstated quantity. The drawing is the same as for the 175 Ah model: thickness drawn at 300 kgf ± 20 kgf; heights H2 207.10 and H1 204.20 ± 0.5 mm. Held: '1P Discharge Energy Retention ≥95%' (reference and test not stated). Not recorded: the 'Special at 0V: Shippable and Rechargeable' claim (a qualitative statement, no voltage quantity fits it). The cycle-life graph is not digitised."
  },
