    "redistributable": false,
    "note": "Facts only; source body is not redistributed. One-page supplier datasheet supplied to Lemonergy by a commercial partner on 2026-10-28. The document is issued by a distributor, not by the cell producer, and does not name the producer; the manufacturer is therefore recorded as not stated. The model number is the distributor's designation. The issuing distributor's company name and its contact person, e-mail address and telephone number appear on the document and are deliberately not recorded, at the repository owner's instruction. The document is identified by its SHA-256 only and has no public URL. The datasheet names no cathode chemistry. It prints '15C/200A Cont.'; 15 × 13 Ah is 195 A, and both figures are kept as printed without reconciliation. The partner spreadsheet's JNC46145H (PB, 3.2 V, Ø46.7×145 mm, 20C cont) is not established to be the same part and is a separate record. Held: the 5C and 10C high-rate temperature and voltage tables (a module '4S voltage' is mixed into them), the nail penetration claim ('Passed', no test standard named). Not recorded: the 'Special at 0V: Shippable and Rechargeable' claim (a qualitative statement, no voltage quantity fits it). The cycle-life graph is not digitised."
  },
