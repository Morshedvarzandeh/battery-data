    "redistributable": false,
    "note": "Facts only; source body is not redistributed. One-page supplier datasheet supplied to Lemonergy by a commercial partner on 2026-10-28. The document is issued by a distributor, not by the cell producer, and does not name the producer; the manufacturer is therefore recorded as not stated. The model number is the distributor's designation. The issuing distributor's company name and its contact person, e-mail address and telephone number appear on the document and are deliberately not recorded, at the repository owner's instruction. The document is identified by its SHA-256 only and has no public URL. The partner spreadsheet lists the same model as JNP1814867 (NVP, 5.5 Ah, 2.9 V, 148×18×67 mm, 290 g, ≤1.1 mΩ, 10C std / 40C max, 30C cont / 75C pulse, charge and discharge −40~55°C); it is filed once, from this datasheet, with JNP1814867 as an alias. The two documents disagree on one label: the sheet prints the 8000-cycle figure at (1C), this datasheet at (2C); the datasheet's label is recorded. The sheet gives the chemistry as NVP; this datasheet does not. Amperes are the datasheet's own figures printed beside each C-rate. The cycle-life graph's caption (25°C, 0-100% SOC, 1C charge / 2C discharge) is not attached to the ≥8000 figure, which the graph does not reach. Held: '40C/220A Peak' charge (no peak-charge quantity; duration not stated), the ≥2400 W/kg power density's test conditions are all unstated, the nail penetration claim ('Passed', no test standard named). Not recorded: the 'Special at 0V: Shippable and Rechargeable' claim (a qualitative statement, no voltage quantity fits it). Temperature-rise graphs are not digitised."
  },
