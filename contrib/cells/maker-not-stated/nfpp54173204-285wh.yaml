    "redistributable": false,
    "note": "Facts only; source body is not redistributed. One-page supplier datasheet supplied to Lemonergy by a commercial partner on 2026-10-28. The document is issued by a distributor, not by the cell producer, and does not name the producer; the manufacturer is therefore recorded as not stated. The model number is the distributor's designation. The issuing distributor's company name and its contact person, e-mail address and telephone number appear on the document and are deliberately not recorded, at the repository owner's instruction. The document is identified by its SHA-256 only and has no public URL. Cathode family is read from the NFPP prefix of the model designation. The charge row prints '1C/300A Cont.'; 1C of the 100 Ah nominal capacity would be 100 A, so the 300 A figure conflicts with its own label and is not recorded as a continuous current; the 1C rate is. The ≥90 Wh/kg figure and 285 Wh / 3.3 kg (about 86 Wh/kg) disagree; both are kept as printed. The dimension drawing prints 53.7 ± 0.5 × 173.5 ± 0.8 mm and two heights, 207.2 ± 0.8 and 204.4 ± 0.6 mm, which differ from the table's rounded 54-173-204 mm; both are kept, the table first. Terminal spacing 123 ± 0.3 mm has no quantity and is not recorded. The partner spreadsheet's JNP54173207L (173.5×53.5×204.5 mm) is not established to be the same part and is a separate record. Held: '3C 300A Peak 10s' charge (no peak-charge quantity), the nail penetration claim ('Passed', no test standard named). Not recorded: the 'Special at 0V: Shippable and Rechargeable' claim (a qualitative statement, no voltage quantity fits it). The cycle-life graph is not digitised."
  },
