# battery-data community contribution — generated from a source document
# Validated in CI against json-schema/cell-contribution.schema.json
#
# IDENTITY NOTE
# CX2 is CALCE's own sample label, not a manufacturer's model number. 
# Cells are individually numbered CX2_n.
# CALCE is the testing laboratory, not the manufacturer.
schema_version: "1"

product:
  uid: cell/unstated/cx2
  kind: cell
  manufacturer: "unstated"
  model_number: "unstated"
  form_factor: prismatic_hardcase
  is_rechargeable: true

source:
  uid: src/calce-battery-research-group-university-of-maryland
  kind: dataset
  title: CALCE Battery Data — Center for Advanced Life Cycle Engineering
  url: https://calce.umd.edu/battery-data
  document_date: "2026-07"
  redistributable: false

chemistry:
  designation: LCO
  cathode_text: LiCoO2 (EDS showed trace elements of manganese)

observations:
  - quantity: capacity
    statistic: rated
    value: 1.35
    unit: Ah
    conditions:
      unstated: [rate_value, rate_unit, temperature_c, voltage_lower_v]
    locator:
      quote: Capacity Rating 1350 mAh
  - quantity: mass
    statistic: typical
    value: 28
    unit: g
    locator:
      quote: Weight (w/o safety circuit) 28g
  - quantity: thickness
    statistic: nominal
    value: 6.6
    unit: mm
    locator:
      quote: Dimensions 6.6 x 33.8 x 50 mm
  - quantity: width
    statistic: nominal
    value: 33.8
    unit: mm
    locator:
      quote: Dimensions 6.6 x 33.8 x 50 mm
  - quantity: height
    statistic: nominal
    value: 50.0
    unit: mm
    locator:
      quote: Dimensions 6.6 x 33.8 x 50 mm
  - quantity: charge_cutoff_voltage
    statistic: maximum
    value: 4.2
    unit: V
    locator:
      quote: constant current rate of 0.5C until the voltage reached 4.2V
  - quantity: discharge_cutoff_voltage
    statistic: minimum
    value: 2.7
    unit: V
    locator:
      quote: the discharge cut off voltage for these batteries was 2.7V
