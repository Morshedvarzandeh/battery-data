# battery-data community contribution — generated from a source document
# Validated in CI against json-schema/cell-contribution.schema.json
#
# IDENTITY NOTE
# PL is CALCE's own sample label. Cells are individually numbered PL n.
# CALCE is the testing laboratory, not the manufacturer.
schema_version: "1"

product:
  uid: cell/unstated/pl-sample
  kind: cell
  manufacturer: "unstated"
  model_number: "unstated"
  form_factor: pouch
  is_rechargeable: true

source:
  uid: src/calce-battery-research-group-university-of-maryland
  kind: dataset
  title: CALCE Battery Data — Center for Advanced Life Cycle Engineering
  url: https://calce.umd.edu/battery-data
  document_date: "2026-07"
  redistributable: false

chemistry:
  designation: LCO
  cathode_text: LiCoO2
  anode_text: Graphite

observations:
  - quantity: capacity
    statistic: rated
    value: 1.5
    unit: Ah
    conditions:
      unstated: [rate_value, rate_unit, temperature_c, voltage_lower_v]
    locator:
      quote: Capacity Rating 1500 mAh
  - quantity: mass
    statistic: typical
    value: 30.3
    unit: g
    locator:
      quote: Weight (without safety circuit) 30.3 g
  - quantity: thickness
    statistic: nominal
    value: 3.4
    unit: mm
    locator:
      quote: Dimensions 3.4 x 84.4 x 50.1 mm
  - quantity: width
    statistic: nominal
    value: 84.4
    unit: mm
    locator:
      quote: Dimensions 3.4 x 84.4 x 50.1 mm
  - quantity: height
    statistic: nominal
    value: 50.1
    unit: mm
    locator:
      quote: Dimensions 3.4 x 84.4 x 50.1 mm
