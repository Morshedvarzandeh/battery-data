# battery-data community contribution — generated from a source document
# Validated in CI against json-schema/cell-contribution.schema.json
schema_version: "1"

product:
  uid: cell/unstated/cs2
  kind: cell
  manufacturer: unstated
  model_number: CS2
  form_factor: prismatic_hardcase
  is_rechargeable: true

source:
  uid: src/calce-battery-research-group-university-of-maryland
  kind: dataset
  title: CALCE Battery Data — Center for Advanced Life Cycle Engineering
  url: https://calce.umd.edu/battery-data
  document_date: "2026-07"
  redistributable: false

chemistry:
  designation: LCO
  cathode_text: LiCoO2 (EDS also showed trace manganese)

observations:
  - quantity: capacity
    statistic: rated
    value: 1.1
    unit: Ah
    conditions:
      unstated: [rate_value, rate_unit, temperature_c, voltage_lower_v]
    locator:
      quote: Capacity Rating 1100 mAh
  - quantity: mass
    statistic: typical
    value: 21.1
    unit: g
    locator:
      quote: Weight (w/o safety circuit) 21.1 g
  - quantity: thickness
    statistic: nominal
    value: 5.4
    unit: mm
    locator:
      quote: Dimensions 5.4 x 33.6 x 50.6 mm
  - quantity: width
    statistic: nominal
    value: 33.6
    unit: mm
    locator:
      quote: Dimensions 5.4 x 33.6 x 50.6 mm
  - quantity: height
    statistic: nominal
    value: 50.6
    unit: mm
    locator:
      quote: Dimensions 5.4 x 33.6 x 50.6 mm
  - quantity: charge_cutoff_voltage
    statistic: maximum
    value: 4.2
    unit: V
    locator:
      quote: constant current rate of 0.5C until the voltage reached 4.2V
  - quantity: discharge_cutoff_voltage
    statistic: minimum
    value: 2.7
    unit: V
    locator:
      quote: the discharge cut off voltage for these batteries was 2.7V
  - quantity: cv_cutoff_current
    statistic: typical
    value: 50
    unit: mA
    locator:
      quote: 4.2V was sustained until the charging current dropped to below 0.05A
