    "note": "Facts only; source body is not redistributed. VARTA Automotive PDF datasheet for 560500064K262 (title 'Datasheet for Battery: 560500064K262', 2 pages, 227,682 bytes), as rendered by VARTA's datasheet service on 2026-10-30; the service renders the PDF on each download, so the SHA-256 identifies the copy inspected. VARTA Automotive batteries are made and sold by Clarios ('Clarios manufactures and distributes VARTA Automotive batteries', varta-automotive.com home page), so the manufacturer is Clarios and the model keeps the VARTA name. Dynamic EFB is the renamed Silver Dynamic EFB. EFB is lead-acid: the product page states 'While EFB is an improved flooded battery'. The datasheet prints capacity, CCA, voltage, dimensions (L/W/H), case size, short code, UK code, weight filled, base hold-down, layout and terminal type. It prints no unit for the dimensions; they are millimetres per the product page's tooltip ('The dimensions are in millimetres (mm).'). The capacity's rate, temperature and end voltage and the CCA's standard, temperature, duration and end voltage are not stated. 'Weight filled' is the battery with its electrolyte. Replaced the product page (src/varta-dynamic-efb-560500064-web-2026-10-29) as this record's source on 2026-10-30, because the datasheet prints every figure the page did and the weight; each recorded figure was re-located in the datasheet text, and all agree with the page."
