    "note": "Facts only; source body is not redistributed. VARTA Automotive product detail page (HTML as fetched). VARTA Automotive batteries are made and sold by Clarios ('Clarios manufactures and distributes VARTA Automotive batteries', varta-automotive.com home page), so the manufacturer is Clarios and the model keeps the VARTA name. Dynamic EFB is the renamed Silver Dynamic EFB ('Dynamic EFB replaces the well-known Silver Dynamic EFB'). The page prints capacity, CCA, voltage and dimensions only: the capacity's rate, temperature and end voltage and the CCA's standard, temperature, duration and end voltage are not stated. Dimensions are L/W/H in millimetres per the page's tooltip. The linked PDF datasheet could not be opened for this review (download only), so weight and the rated values it may print are not recorded. The regional listing at https://www.varta-automotive.com/en/products/automotive/dynamic-efb prints different dimensions for some models; only this product page's figures are recorded. The page body changes from one fetch to the next, so the SHA-256 identifies the copy inspected; every recorded figure was re-read from a fresh copy before acceptance. Page body 208,302 bytes. The regional listing prints 314/175/175 for this model."
