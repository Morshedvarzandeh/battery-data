    "note": "Facts only; source body is not redistributed. EnerSys ODYSSEY specification web page (HTML as fetched, 194,170 bytes). 'All values shown are nominal unless otherwise noted.' The cranking ratings (MHPCA, MPCA, CCA, HCA, MCA) carry the footnote 'Cold Start Performance S.A.E J537 Apr 2016'; the page prints no temperature, duration or end voltage for them, so those stay unstated and the rating name is kept in extra. PHCA is printed as a 5-second '**Pulse Current' and is recorded as a 5 s pulse discharge current. Capacities print no temperature or end voltage. Weight and dimensions are the metric figures in parentheses; dimensions are maxima, total height first and container height second. Internal resistance is printed without its method and is not recorded. The AGM designation comes from the ODYSSEY Extreme series page (https://www.odysseybattery.com/extreme-series-batteries/, retrieved 2026-10-29), not from this table. Terminal and torque columns are not recorded."
