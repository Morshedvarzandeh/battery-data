[package]
name = "battery-patent-miner"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Provenance-first discovery, normalization and classification of battery patents"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.12"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
